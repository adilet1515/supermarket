{% extends 'products/base.html' %}

{% block title %}
    Confirm delete product #{{ object.pk }}
{% endblock %}

{% block body %}
    <form method="post">{% csrf_token %}
        <p>Are you sure you want to delete "{{ object.name }}"?</p>
        {{ form }}
        <input type="submit" value="Delete!">
    </form>
{% endblock %}
